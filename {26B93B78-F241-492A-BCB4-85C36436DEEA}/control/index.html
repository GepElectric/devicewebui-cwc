<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DeviceWebUI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <script src="./js/webcc.min.js"></script>
</head>
<body>
  <div id="appShell" class="app-shell mode-split">
    <div class="toolbar">
      <select id="folderSelect" class="toolbar-select"></select>
      <div class="zoom-group">
        <button id="zoomSplit" class="toolbar-button active" type="button">Split</button>
        <button id="zoomViewer" class="toolbar-button" type="button">Viewer</button>
        <button id="zoomFullscreen" class="toolbar-button" type="button">Fullscreen</button>
      </div>
    </div>

    <div class="content-shell">
      <aside id="browserPanel" class="browser-panel">
        <div id="browserStatus" class="browser-status">Set `rootFolder` property.</div>
        <div id="entryList" class="entry-list"></div>
      </aside>

      <section class="viewer-panel">
        <div class="viewer-shell">
          <div id="webViewer" class="web-viewer">
            <iframe id="webFrame" class="web-frame" title="Device WebUI link" loading="eager"></iframe>
          </div>

          <div id="fallbackPanel" class="fallback-panel">
            <div id="fallbackText" class="placeholder">Select new device</div>
            <a id="fallbackLink" class="open-link" href="#" target="_blank" rel="noopener noreferrer">Open Link</a>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
      let currentRootFolder = "";
      let initialFolderName = "";
      let currentLastPath = "";
    let currentZoomMode = "split";
    let selectedFolderPath = "";
    let folderOptions = [];
    let currentFolderFiles = [];
    let latestBrowseRequestId = 0;
    let currentSelectedFileName = "";
    let currentSelectedFilePath = "";
    let currentSelectedUrl = "";
    let currentProxySessionId = "";
    const browseCache = new Map();
    const linkCache = new Map();

    const LOCAL_BROWSE_SERVER = "http://127.0.0.1:8766/browse";
    const LOCAL_LINK_SERVER = "http://127.0.0.1:8766/link";
    const LOCAL_PROXY_SERVER = "http://127.0.0.1:8766/proxy";
    const PROXY_REVISION = "20260319-ytfix2";
    const CONNECTION_ERROR_MESSAGE = "No connection to selected device.";

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeWindowsPath(value) {
      const rawValue = String(value || "").trim().replace(/\//g, "\\");
      if (!rawValue) {
        return "";
      }

      const driveMatch = rawValue.match(/^[A-Za-z]:\\/);
      if (driveMatch) {
        return driveMatch[0] + rawValue.substring(driveMatch[0].length).replace(/\\+/g, "\\").replace(/\\+$/g, "");
      }

      return rawValue.replace(/\\+/g, "\\").replace(/\\+$/g, "");
    }

    function normalizeRelativePath(value) {
      return String(value || "")
        .trim()
        .replace(/\//g, "\\")
        .replace(/^\\+/, "")
        .replace(/\\+/g, "\\");
    }

    function normalizeRootFolder(value) {
      return normalizeWindowsPath(String(value || "").trim());
    }

    function updateZoomButtons() {
      document.getElementById("zoomSplit").classList.toggle("active", currentZoomMode === "split");
      document.getElementById("zoomViewer").classList.toggle("active", currentZoomMode === "viewer");
      document.getElementById("zoomFullscreen").classList.toggle("active", currentZoomMode === "fullscreen");
    }

    function isFullscreenActive() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.msFullscreenElement
      );
    }

    function setZoomMode(mode) {
      currentZoomMode = mode;
      document.getElementById("appShell").className = "app-shell mode-" + mode;
      updateZoomButtons();
    }

    async function enterFullscreen() {
      const target = document.documentElement;
      if (target.requestFullscreen) {
        await target.requestFullscreen();
        return true;
      }
      if (target.webkitRequestFullscreen) {
        target.webkitRequestFullscreen();
        return true;
      }
      if (target.msRequestFullscreen) {
        target.msRequestFullscreen();
        return true;
      }
      return false;
    }

    async function exitFullscreen() {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
        return true;
      }
      if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
        return true;
      }
      if (document.msExitFullscreen) {
        document.msExitFullscreen();
        return true;
      }
      return false;
    }

    async function toggleFullscreenMode() {
      try {
        if (isFullscreenActive()) {
          await exitFullscreen();
          setZoomMode("viewer");
          return;
        }

        const entered = await enterFullscreen();
        setZoomMode("fullscreen");
        if (!entered) {
          setZoomMode("fullscreen");
        }
      } catch (_error) {
        setZoomMode("fullscreen");
      }
    }

    function setFallback(message, href) {
      const fallbackPanel = document.getElementById("fallbackPanel");
      const fallbackText = document.getElementById("fallbackText");
      const fallbackLink = document.getElementById("fallbackLink");
      const webViewer = document.getElementById("webViewer");

      webViewer.style.display = "none";
      fallbackPanel.style.display = "flex";
      fallbackText.textContent = message;

      if (href) {
        fallbackLink.href = href;
        fallbackLink.style.display = "inline-flex";
      } else {
        fallbackLink.removeAttribute("href");
        fallbackLink.style.display = "none";
      }
    }

    function showConnectionFallback() {
      setFallback(CONNECTION_ERROR_MESSAGE, currentSelectedUrl || "");
    }

    function getBrowseCacheKey(rootFolder, relativePath) {
      return normalizeRootFolder(rootFolder) + "::" + normalizeRelativePath(relativePath || "");
    }

    function cloneBrowsePayload(payload) {
      return payload ? JSON.parse(JSON.stringify(payload)) : payload;
    }

    async function fetchBrowsePayload(rootFolder, relativePath) {
      const cacheKey = getBrowseCacheKey(rootFolder, relativePath);
      if (browseCache.has(cacheKey)) {
        return cloneBrowsePayload(browseCache.get(cacheKey));
      }

      const payload = await fetchJson(
        LOCAL_BROWSE_SERVER +
        "?root=" + encodeURIComponent(rootFolder) +
        "&path=" + encodeURIComponent(relativePath || "")
      );

      browseCache.set(cacheKey, cloneBrowsePayload(payload));
      return payload;
    }

    async function fetchResolvedLink(filePath) {
      const normalizedPath = normalizeWindowsPath(filePath);
      const cacheKey = normalizeRootFolder(currentRootFolder) + "::" + normalizedPath;
      if (linkCache.has(cacheKey)) {
        return linkCache.get(cacheKey);
      }

      const payload = await fetchJson(
        LOCAL_LINK_SERVER +
        "?path=" + encodeURIComponent(normalizedPath) +
        "&root=" + encodeURIComponent(currentRootFolder)
      );
      linkCache.set(cacheKey, payload);
      return payload;
    }

    function createProxySessionId() {
      return "sid-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
    }

    function buildProxyUrl(url, forceReload) {
      let proxyUrl = LOCAL_PROXY_SERVER +
        "?target=" + encodeURIComponent(url) +
        "&rev=" + encodeURIComponent(PROXY_REVISION);

      if (forceReload || !currentProxySessionId) {
        currentProxySessionId = createProxySessionId();
      }

      proxyUrl += "&sid=" + encodeURIComponent(currentProxySessionId);

      if (forceReload) {
        proxyUrl += "&load=" + Date.now();
      }

      return proxyUrl;
    }

    function showWebViewer(url, forceReload) {
      const webViewer = document.getElementById("webViewer");
      const fallbackPanel = document.getElementById("fallbackPanel");
      const webFrame = document.getElementById("webFrame");
      const proxyUrl = buildProxyUrl(url, forceReload);

      fallbackPanel.style.display = "none";
      webViewer.style.display = "flex";
      if (forceReload || webFrame.dataset.proxyUrl !== proxyUrl) {
        webFrame.dataset.proxyUrl = proxyUrl;
        webFrame.src = proxyUrl;
      }
    }

    function inspectFrameForErrors() {
      const webFrame = document.getElementById("webFrame");
      try {
        const frameWindow = webFrame.contentWindow;
        const frameDocument = webFrame.contentDocument || (frameWindow && frameWindow.document);
        if (!frameDocument) {
          return;
        }

        const bodyText = String((frameDocument.body && frameDocument.body.innerText) || "").trim();
        const normalizedText = bodyText.toLowerCase();
        const bodyHtml = String((frameDocument.body && frameDocument.body.innerHTML) || "");

        if (
          normalizedText === "" ||
          normalizedText.startsWith("{\"error\"") ||
          normalizedText.includes("\"error\"") ||
          normalizedText.includes("target url is empty") ||
          normalizedText.includes("not found") ||
          normalizedText.includes("connection refused") ||
          normalizedText.includes("failed to fetch")
        ) {
          showConnectionFallback();
          return;
        }

        if (/^\s*<pre[^>]*>\s*\{\s*"error"\s*:/i.test(bodyHtml)) {
          showConnectionFallback();
        }
      } catch (_error) {
      }
    }

    function renderFolderSelect() {
      const folderSelect = document.getElementById("folderSelect");
      const optionsHtml = folderOptions.map(function(folder) {
        const selected = normalizeRelativePath(folder.relativePath) === normalizeRelativePath(selectedFolderPath) ? " selected" : "";
        return "<option value=\"" + escapeHtml(folder.relativePath) + "\"" + selected + ">" + escapeHtml(folder.name) + "</option>";
      }).join("");

      folderSelect.innerHTML = optionsHtml || "<option value=\"\">No folders</option>";
      folderSelect.disabled = !folderOptions.length;
    }

    function updateBrowserStatus(message) {
      document.getElementById("browserStatus").textContent = message;
    }

    function getDisplayFileName(file) {
      const rawName = String((file && file.displayName) || (file && file.name) || "").trim();
      return rawName.replace(/\.txt$/i, "");
    }

    function buildSelectionPathValue(file) {
      const folderValue = normalizeRelativePath(selectedFolderPath || "");
      const fileValue = getDisplayFileName(file);
      return folderValue ? (folderValue + "\\" + fileValue) : fileValue;
    }

    function parseLastPathTarget() {
      const normalized = normalizeRelativePath(currentLastPath || "");
      if (!normalized) {
        return null;
      }

      const parts = normalized.split("\\").filter(Boolean);
      if (!parts.length) {
        return null;
      }

      const fileNameRaw = parts[parts.length - 1];
      const fileNameWithExt = /\.txt$/i.test(fileNameRaw) ? fileNameRaw : fileNameRaw + ".txt";
      const displayName = fileNameRaw.replace(/\.txt$/i, "");
      const folderPath = parts.length > 1 ? parts.slice(0, -1).join("\\") : "";

      return {
        folderPath: folderPath,
        fileNameWithExt: fileNameWithExt.toLowerCase(),
        displayName: displayName.toLowerCase()
      };
    }

    function fireLinkSelectedEvent(file) {
      const pathValue = buildSelectionPathValue(file);
      try {
        WebCC.Events.fire("selectedPathChanged", pathValue);
      } catch (_error) {
      }
      try {
        WebCC.Events.fire("linkSelected", pathValue);
      } catch (_error) {
      }
    }

    function selectEntry(file, forceReload) {
      currentSelectedFileName = String(file.name || "");
      currentSelectedFilePath = normalizeWindowsPath(file.fullPath || "");
      renderEntryList(currentFolderFiles);
      fireLinkSelectedEvent(file);
      loadFileTarget(file, !!forceReload);
    }

    function renderEntryList(files) {
      const entryList = document.getElementById("entryList");
      if (!files || !files.length) {
        entryList.innerHTML = "<div class=\"placeholder entry-placeholder\">No .txt files found.</div>";
        return;
      }

      entryList.innerHTML = files.map(function(file) {
        const isActive = normalizeWindowsPath(file.fullPath || "") === currentSelectedFilePath;
        const buttonClass = "entry-row" + (isActive ? " active" : "");
          const rawName = String(file.name || "");
          const displayName = getDisplayFileName(file) || rawName.replace(/\.txt$/i, "");
        const title = escapeHtml(displayName || rawName);
        const iconHtml = file.iconUrl
          ? "<span class=\"entry-subicon\"><img class=\"entry-subicon-image\" src=\"" + escapeHtml(file.iconUrl) + "\" alt=\"" + escapeHtml(file.iconName || displayName) + "\"></span>"
          : "";
        return "" +
          "<button class=\"" + buttonClass + "\" type=\"button\" data-path=\"" + escapeHtml(file.fullPath || "") + "\" title=\"" + title + "\">" +
          "<span class=\"entry-content\">" +
          iconHtml +
          "<span class=\"entry-name\">" + title + "</span>" +
          "</span>" +
          "</button>";
      }).join("");
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error("Request failed: " + response.status);
      }
      return response.json();
    }

    async function loadFileTarget(file, forceReload) {
      const fullPath = normalizeWindowsPath(file.fullPath || "");
      if (!fullPath) {
        setFallback("Selected file is invalid.", "");
        return;
      }

      try {
        const payload = await fetchResolvedLink(fullPath);
        const firstLine = String(payload.url || "").trim();

        if (!firstLine) {
          currentSelectedUrl = "";
          setFallback("The selected item does not contain a valid link.", "");
          return;
        }

        currentSelectedUrl = firstLine;
        showWebViewer(firstLine, !!forceReload);
      } catch (_error) {
        currentSelectedUrl = "";
        setFallback("Failed to resolve the selected link.", "");
      }
    }

    function getFallbackFolderPath() {
      if (!folderOptions.length) {
        return "";
      }

      if (initialFolderName) {
        const preferred = folderOptions.find(function(folder) {
          return String(folder.name || "").toLowerCase() === initialFolderName.toLowerCase();
        });
        if (preferred) {
          return preferred.relativePath;
        }
      }

      return folderOptions[0].relativePath;
    }

    function resolveRequestedFolderPath() {
      const lastPathTarget = parseLastPathTarget();
      if (lastPathTarget && lastPathTarget.folderPath) {
        const wantedFolder = normalizeRelativePath(lastPathTarget.folderPath).toLowerCase();
        const exactMatch = folderOptions.find(function(folder) {
          return normalizeRelativePath(folder.relativePath || "").toLowerCase() === wantedFolder;
        });
        if (exactMatch) {
          return exactMatch.relativePath;
        }
      }

      return getFallbackFolderPath();
    }

    function restoreSelectionFromFiles(files) {
      const lastPathTarget = parseLastPathTarget();
      if (!lastPathTarget) {
        return false;
      }

      const match = (files || []).find(function(file) {
        const fileName = String(file.name || "").trim().toLowerCase();
        const displayName = getDisplayFileName(file).toLowerCase();
        return fileName === lastPathTarget.fileNameWithExt || displayName === lastPathTarget.displayName;
      });
      if (!match) {
        return false;
      }

      selectEntry(match, false);
      return true;
    }

    async function browseTo(relativePath) {
      if (!currentRootFolder) {
        updateBrowserStatus("Set `rootFolder` property.");
        renderFolderSelect();
        renderEntryList([]);
        linkCache.clear();
        setFallback("Set `rootFolder` property.", "");
        return;
      }

      const requestId = ++latestBrowseRequestId;
      try {
        const payload = await fetchBrowsePayload(currentRootFolder, relativePath || "");

        if (requestId !== latestBrowseRequestId) {
          return;
        }

        folderOptions = Array.isArray(payload.folders) ? payload.folders : [];
        currentFolderFiles = Array.isArray(payload.files) ? payload.files : [];
        selectedFolderPath = normalizeRelativePath(payload.currentRelativePath || relativePath || "");

        renderFolderSelect();
        renderEntryList(currentFolderFiles);
        updateBrowserStatus(currentFolderFiles.length ? "" : "No .txt files found in this folder.");

        if (!restoreSelectionFromFiles(currentFolderFiles)) {
          currentSelectedFilePath = "";
          currentSelectedFileName = "";
          currentSelectedUrl = "";
          setFallback("Select new device", "");
        }
      } catch (_error) {
        updateBrowserStatus("Folder browser is not available. Start the localhost DeviceWebUI server.");
        renderFolderSelect();
        renderEntryList([]);
        setFallback("Folder browser is not available. Start the localhost DeviceWebUI server.", "");
      }
    }

    function handleFolderChange(relativePath) {
      selectedFolderPath = normalizeRelativePath(relativePath);
      currentSelectedFilePath = "";
      currentSelectedFileName = "";
      currentSelectedUrl = "";
      browseTo(selectedFolderPath);
    }

    function handleRootFolderProperty(value) {
      currentRootFolder = normalizeRootFolder(value);
      browseCache.clear();
      linkCache.clear();
      folderOptions = [];
      selectedFolderPath = "";
      currentFolderFiles = [];
      currentSelectedFilePath = "";
      currentSelectedFileName = "";
      currentSelectedUrl = "";

      if (!currentRootFolder) {
        renderFolderSelect();
        renderEntryList([]);
        updateBrowserStatus("Set `rootFolder` property.");
        setFallback("Set `rootFolder` property.", "");
        return;
      }

      fetchBrowsePayload(currentRootFolder, "")
        .then(function(payload) {
          folderOptions = Array.isArray(payload.folders) ? payload.folders : [];
          selectedFolderPath = resolveRequestedFolderPath();
          renderFolderSelect();
          browseTo(selectedFolderPath);
        })
        .catch(function() {
          renderFolderSelect();
          renderEntryList([]);
          updateBrowserStatus("Folder browser is not available. Start the localhost DeviceWebUI server.");
          setFallback("Folder browser is not available. Start the localhost DeviceWebUI server.", "");
        });
    }

    function setProperty(data) {
      switch (data.key) {
        case "rootFolder":
          handleRootFolderProperty(data.value);
          break;
        case "initialFolderName":
          initialFolderName = String(data.value || "").trim();
          if (currentRootFolder) {
            handleRootFolderProperty(currentRootFolder);
          }
          break;
        case "last_path":
          currentLastPath = String(data.value || "").trim();
          if (currentRootFolder && folderOptions.length) {
            const wantedFolder = resolveRequestedFolderPath();
            if (wantedFolder && normalizeRelativePath(wantedFolder) !== normalizeRelativePath(selectedFolderPath)) {
              handleFolderChange(wantedFolder);
            } else if (!restoreSelectionFromFiles(currentFolderFiles) && folderOptions.length) {
              const fallbackFolder = getFallbackFolderPath();
              if (fallbackFolder && normalizeRelativePath(fallbackFolder) !== normalizeRelativePath(selectedFolderPath)) {
                handleFolderChange(fallbackFolder);
              }
            }
          }
          break;
      }
    }

    async function switchToMode(mode) {
      if (isFullscreenActive()) {
        try {
          await exitFullscreen();
        } catch (_error) {
        }
      }
      setZoomMode(mode);
    }

    document.getElementById("zoomSplit").addEventListener("click", function() {
      switchToMode("split");
    });

    document.getElementById("zoomViewer").addEventListener("click", function() {
      switchToMode("viewer");
    });

    document.getElementById("zoomFullscreen").addEventListener("click", function() {
      toggleFullscreenMode();
    });

    document.addEventListener("fullscreenchange", function() {
      if (!isFullscreenActive() && currentZoomMode === "fullscreen") {
        setZoomMode("viewer");
      }
    });

    document.getElementById("folderSelect").addEventListener("change", function(event) {
      handleFolderChange(event.currentTarget.value);
    });

    document.getElementById("entryList").addEventListener("click", function(event) {
      const button = event.target.closest(".entry-row");
      if (!button) {
        return;
      }

      const selectedPath = normalizeWindowsPath(button.getAttribute("data-path"));
      const match = currentFolderFiles.find(function(file) {
        return normalizeWindowsPath(file.fullPath || "") === selectedPath;
      });
      if (match) {
        selectEntry(match, true);
      }
    });

    document.getElementById("webFrame").addEventListener("load", function() {
      setTimeout(inspectFrameForErrors, 50);
    });

    document.getElementById("webFrame").addEventListener("error", function() {
      showConnectionFallback();
    });

    WebCC.start(
      function(result) {
          if (result) {
            initialFolderName = String(WebCC.Properties.initialFolderName || "").trim();
            currentLastPath = String(WebCC.Properties.last_path || "").trim();
            setZoomMode("split");
            handleRootFolderProperty(WebCC.Properties.rootFolder);
            WebCC.onPropertyChanged.subscribe(setProperty);
          }
        },
      {
        methods: {},
        events: ["selectedPathChanged", "linkSelected"],
        properties: {
          rootFolder: "",
          initialFolderName: "",
          last_path: ""
        }
      },
      [],
      10000
    );
  </script>
</body>
</html>
